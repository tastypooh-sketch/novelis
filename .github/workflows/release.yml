
name: Build and Release Novelis Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform(s) to build'
        required: true
        default: 'mac_and_windows'
        type: choice
        options:
          - 'mac_and_windows'
          - 'mac_only'
          - 'windows_only'
          - 'all'

permissions:
  contents: write

jobs:
  release-desktop:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    if: >-
      github.event_name == 'push' ||
      inputs.target == 'all' ||
      (inputs.target == 'mac_and_windows' && (matrix.os == 'macos-latest' || matrix.os == 'windows-latest')) ||
      (inputs.target == 'mac_only' && matrix.os == 'macos-latest') ||
      (inputs.target == 'windows_only' && matrix.os == 'windows-latest')

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Linux build tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libicns-dev graphicsmagick xz-utils rpm

      - name: Build & Release (macOS Universal)
        if: matrix.os == 'macos-latest'
        run: npm run electron:build:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Release (Windows Setup)
        if: matrix.os == 'windows-latest'
        run: npm run electron:build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Release (Linux Chromebook/Debian)
        if: matrix.os == 'ubuntu-latest'
        run: npm run electron:build:linux -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

