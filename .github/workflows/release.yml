
name: Build and Release Novelis Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform(s) to build'
        required: true
        default: 'mac_and_windows'
        type: choice
        options:
          - 'mac_and_windows'
          - 'mac_only'
          - 'windows_only'
          - 'all'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build & Release macOS
    runs-on: macos-latest
    if: >-
      github.event_name == 'push' ||
      inputs.target == 'all' ||
      inputs.target == 'mac_and_windows' ||
      inputs.target == 'mac_only'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build & Release (macOS Universal)
        run: npm run electron:build:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build & Release Windows
    runs-on: windows-latest
    if: >-
      github.event_name == 'push' ||
      inputs.target == 'all' ||
      inputs.target == 'mac_and_windows' ||
      inputs.target == 'windows_only'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build & Release (Windows Setup)
        run: npm run electron:build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build & Release Linux
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      inputs.target == 'all'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libicns-dev graphicsmagick xz-utils rpm

      - name: Build & Release (Linux Chromebook/Debian)
        run: npm run electron:build:linux -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

